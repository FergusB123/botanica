<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Botanica — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #070A07;
      color: #F0FDF4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 48px; }
    h1 { font-size: 24px; font-weight: 700; }
    p  { font-size: 14px; color: rgba(240,253,244,0.5); max-width: 280px; line-height: 1.6; }
    button {
      margin-top: 8px;
      background: #4ADE80;
      color: #070A07;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="icon">🌿</div>
  <h1>You're offline</h1>
  <p>Check your connection and try again. Your plant data will sync when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
